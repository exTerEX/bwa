name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      OS: linux
      ARCH: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package release binary
        run: |
          set -euo pipefail
          test -f build/bwa
          mkdir -p dist
          cp build/bwa "dist/bwa-${TAG}-${OS}-${ARCH}"
          chmod +x "dist/bwa-${TAG}-${OS}-${ARCH}"

      - name: Create or update GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          artifacts: dist/bwa-${{ env.TAG }}-${{ env.OS }}-${{ env.ARCH }}
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true
